name: Build plugin release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify the release version
        run: |
          node --check main.js
          node -e 'const m = require("./manifest.json"); if (m.version !== process.env.GITHUB_REF_NAME || require("./versions.json")[m.version] !== m.minAppVersion) process.exit(1)'
      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$GITHUB_REF_NAME" --pattern main.js --pattern manifest.json --pattern styles.css --dir "$RUNNER_TEMP/release-assets" --clobber
          for asset in main.js manifest.json styles.css; do
            cmp "$asset" "$RUNNER_TEMP/release-assets/$asset"
          done
          for asset in main.js styles.css; do
            gh attestation verify "$RUNNER_TEMP/release-assets/$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
