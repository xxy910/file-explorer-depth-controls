name: Build plugin release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify the release version
        run: |
          node --check main.js
          node -e 'const m = require("./manifest.json"); if (m.version !== process.env.GITHUB_REF_NAME || require("./versions.json")[m.version] !== m.minAppVersion) process.exit(1)'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
